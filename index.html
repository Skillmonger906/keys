<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Keys</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>Keys</b><nav><button data-go="home">Lessons</button><button data-go="cal">Calibrate</button></nav></header>
<main>
<section id="home"></section>
<section id="cal" hidden>
 <p>Use headphones for lesson videos and a quiet room. Put the iPad near the piano.</p>
 <button id="micBtn" class="big">Start microphone</button>
 <div class="meter"><i id="lvl"></i></div>
 <div id="det">–</div>
 <label>Sensitivity <input id="sens" type="range" min="0" max="1" step="0.05"></label>
 <label>Octave <select id="oct"><option value="any">Any octave</option><option value="exact">Exact octave</option></select></label>
 <button id="testC" class="big">Test: play middle C</button><div id="testOut"></div>
</section>
<section id="play" hidden>
 <div class="bar"><button id="back">Back</button><span id="ttl"></span><span id="stat"></span></div>
 <div id="tipbar"></div><canvas id="lane"></canvas><div id="kb"></div>
</section></main>
<script type="module" src="js/ui.js"></script></body></html>
